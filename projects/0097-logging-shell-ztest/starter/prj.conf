CONFIG_GPIO=y
CONFIG_PRINTK=y

# The shell is on, so the shell_print() calls in main.c link. Without CONFIG_SHELL=y the
# linker fails with "undefined reference to shell_fprintf_impl", which is a good example of
# a missing Kconfig option (see lesson 97).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# TODO(learner): turn on the logger with these two lines, from lesson 97:
#   CONFIG_LOG=y
#   CONFIG_LOG_DEFAULT_LEVEL=3
# and add CONFIG_SHELL_LOG_BACKEND=y so that LOG_INF lines reach the serial monitor.
