CONFIG_GPIO=y
CONFIG_PRINTK=y

# Logging (subsys/logging). LOG_MODULE_REGISTER in main.c needs this to print anything.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# The shell (subsys/shell). The serial backend is chosen by the board's zephyr,shell-uart
# node, which is uart0 on the Pico. Turning the shell on also makes the UART log backend off
# by default (subsys/logging/backends/Kconfig.uart), so logs go through the shell instead.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
