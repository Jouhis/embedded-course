# Read by Twister. Twister builds each entry for the listed platforms and runs it.
#   native_sim   Linux host simulator, the usual CI target. Needs Linux (or WSL) with a host gcc.
#   rpi_pico     the Pico: builds the same tests for the board. Run them in Wokwi or on hardware.
common:
  tags: unit
  harness: ztest
tests:
  app.temp_format:
    platform_allow: native_sim rpi_pico
    integration_platforms:
      - native_sim
