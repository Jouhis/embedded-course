# Binding for the MYS-1 temperature sensor (the teaching chip from lesson 63, WHO_AM_I 0xA7,
# I2C address 0x48). It adds nothing to i2c-device.yaml, so the node gets the reg property and
# the bus. No driver uses it yet: main.c talks to the device through the i2c_dt_spec.
description: MYS-1 I2C temperature sensor (course teaching part)

compatible: "vnd,mystery-sensor"

include: i2c-device.yaml
