# prj.conf holds Kconfig symbols for this application only. Every CONFIG_ line here overrides
# the default of the symbol; anything you leave out keeps the default from Zephyr's Kconfig
# files or from the board's defconfig. Inspect the result in build/zephyr/.config.

CONFIG_GPIO=y
CONFIG_PRINTK=y

# The logging subsystem. Without CONFIG_LOG=y the LOG_* macros compile to nothing.
CONFIG_LOG=y
# 0 = off, 1 = error, 2 = warning, 3 = info, 4 = debug (LOG_DEFAULT_LEVEL range in subsys/logging/Kconfig.filtering).
CONFIG_LOG_DEFAULT_LEVEL=3
# Immediate mode prints each message where it is logged. Deferred mode (the default) queues
# the text and sends it from a thread, which is cheaper for the caller but adds delay.
CONFIG_LOG_MODE_IMMEDIATE=y

# The stack of main(). The default is small, and the logger's printf-style formatting is deep.
CONFIG_MAIN_STACK_SIZE=2048
