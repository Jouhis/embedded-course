# Binding for a push button wired from a GPIO to ground (active low, with a pull-up).
description: Push button on a GPIO pin, pressed = pin low

compatible: "vnd,user-button"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: The GPIO the button is wired to, with its active-low and pull-up flags.
