# Binding for the SSD1306 OLED on I2C. The Lab 4 driver (app/ssd1306.c) writes to it through
# hal_i2c_write(), so this node only describes the device and checks its address at build time.
description: SSD1306 128x64 OLED on I2C (drawn by the application, not by a Zephyr driver)

compatible: "vnd,ssd1306-oled"

include: i2c-device.yaml
