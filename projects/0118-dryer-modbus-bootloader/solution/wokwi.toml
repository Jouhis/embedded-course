[wokwi]
version = 1
# One image: the bootloader and the application slot are both in this .hex and .elf.
firmware = 'build/dryer.hex'
elf = 'build/dryer.elf'
gdbServerPort = 3333
# The serial monitor (USART1, PA9 and PA10) is also served on TCP port 4000 (RFC 2217),
# which master_dryer.py in the stage folder uses for Modbus (lesson 101 explains the port).
rfc2217ServerPort = 4000
