# Wokwi automation scenario (lesson 82): run with
#   wokwi-cli . --scenario smoke.scenario.yaml
# from the project folder. Each step runs in order; wait-serial blocks until the text appears.
name: 'LED blinks on the serial monitor'
version: 1
author: 'course'
steps:
  - wait-serial: 'LED on'
  - delay: 500ms
  - wait-serial: 'LED off'
