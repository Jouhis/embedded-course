name: Press the button
version: 1
steps:
  - wait-serial: 'Press the button (PB0)'
  - delay: 100ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 100ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - wait-serial: 'TIM2 nested in EXTI0'
