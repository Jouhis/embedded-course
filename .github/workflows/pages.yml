# Publish the course website to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# The site is static: the pages, their assets, the reference sheets and the project sources
# that lessons link to. Progress is saved in each visitor's own browser.
name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the course
        run: python3 tools/maintainer/check_course.py

      - name: Check the Wokwi diagrams
        run: python3 tools/maintainer/check_diagrams.py

      - name: Check the exercise READMEs are up to date
        run: python3 tools/maintainer/build_exercise_readmes.py --check

      # Search: the keyword index and the smart-search vectors (assets/search/, git-ignored).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/maintainer/search/package-lock.json
      - uses: actions/cache@v6
        with:
          path: tools/maintainer/search/.cache
          key: search-model-${{ hashFiles('tools/maintainer/search/embed.mjs', 'tools/maintainer/search/package-lock.json') }}
      - name: Build the search index
        run: |
          npm ci --prefix tools/maintainer/search
          python3 tools/maintainer/build_search.py --semantic

      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html assets lessons reference projects _site/
          cp VERSION CHANGELOG.md _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
