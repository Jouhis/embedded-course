# Publish the course website to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# The site is static: the pages, their assets, the reference sheets and the project sources
# that lessons link to. Progress is saved in each visitor's own browser.
name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the course
        run: python3 tools/check_course.py

      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html assets lessons reference projects _site/
          cp VERSION CHANGELOG.md _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
